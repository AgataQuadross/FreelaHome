<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/login.css">

</head>

<body>
    <main>
        <form action="POST" class="formulario">
            <h2>Login</h2>
            <div class="container-avatar">
                <img class="avatar" src="assets/img/FotoDePerfil.png" alt="">
            </div>

            <div>
                <input type="text" id="nome" placeholder="Nome Completo" required>
                <input type="email" id="email-cpf" placeholder="Email/CPF" required>
                <input type="password" id="senha" placeholder="Senha" required>
            </div>

            <div class="botoes">
                <a class="btn-cancelar" id="cancelar">Cancelar</a>
                <a href="principal.html"class="btn-entrar id="entrar">Entrar</a>
            </div>

            <div class="links">
                <a href="cadastro.html">Criar conta</a>
                <a href="">Esqueci a senha</a>
            </div>
        </form>
    </main>
</body>

</html>
